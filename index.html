/* ---- expand card lines into every concrete target hand ---- */
const BUILTIN={w:['wN','wE','wW','wS'],d:['dR','dG','dS']};
function perms(n){return n?perms(n-1).flatMap(p=>[0,1,2].filter(s=>!p.includes(s)).map(s=>[...p,s])):[[]]}
const parseAlt=s=>s.split(' ').map(tok=>tok.split('|').map(seg=>{const[body,vn]=seg.split('~');return{col:body[0],txt:body.slice(1),vn}}));
const runs=txt=>{const o=[];for(const ch of txt){if(o.length&&o[o.length-1][0]==ch)o[o.length-1][1]++;else o.push([ch,1])}return o};
const HANDS=[],T=[];
CARD.forEach(S=>S.h.forEach((H,i)=>{H.sec=S.sec;H.line=i+1;H.id=HANDS.length;H.name=S.sec+' #'+(i+1);H.run=H.run!=null?H.run:S.run;H.alts=H.a.map(parseAlt);HANDS.push(H);
 const seen=new Set();
 H.alts.forEach(alt=>{const segs=alt.flat(),cols=[...new Set(segs.filter(s=>'brg'.includes(s.col)).map(s=>s.col))];
  const vars=[...new Set(segs.map(s=>s.vn).filter(Boolean))];let combos=[{}];
  vars.forEach(v=>{const vals=(H.v&&H.v[v])||BUILTIN[v];combos=combos.flatMap(c=>vals.map(x=>({...c,[v]:x})))});
  if(H.ne)combos=combos.filter(c=>c.a!==c.m);
  let shifts=[0];if(H.run){const ds=segs.filter(s=>!s.vn).flatMap(s=>[...s.txt].filter(ch=>/[1-9]/.test(ch)).map(Number));const lo=Math.min(...ds),hi=Math.max(...ds);shifts=[];for(let k=1-lo;k<=9-hi;k++)shifts.push(k)}
  for(const pm of perms(cols.length))for(const cb of combos)for(const sh of shifts){const suit=c=>SU[pm[cols.indexOf(c)]],g=[];
   for(const s of segs)for(const[ch,n]of runs(s.txt)){let k=null;

const cnt=h=>{const c={};h.forEach(t=>c[t.k]=(c[t.k]||0)+1);return c};

const best=h=>{const c=cnt(h),ex=h.some(t=>t.x);let b=null,bd=99;for(const t of T){if(ex&&t.c)continue;const d=dist(t,c);if(d<bd||(d==bd&&t.p>b.p)){bd=d;b=t}}return[b,bd]};
function pick(h,easy){const c=h.filter(t=>!t.x&&t.k!='J').sort((a,b)=>(a.k=='X')-(b.k=='X'));if(!c.length)return null;if(easy&&Math.random()<.35)return c[Math.random()*c.length|0];let bt=null,bd=99;for(const t of c){const[,d]=best(h.filter(u=>u!==t));if(d<bd){bd=d;bt=t}}return bt}

for(let i=w.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[w[i],w[j]]=[w[j],w[i]]}
const N=w.length,per=Math.ceil(Math.ceil(N/2)/4),brk=WO.indexOf(G.dealer)*per+(Math.random()*per|0),seed=Math.random()*2147483647|0;
const hands=[0,1,2,3].map(()=>w.splice(0,13).map(mkT));hands[G.dealer].push(mkT(w.pop()));hands[0].sort((a,b)=>ORDER.indexOf(a.k)-ORDER.indexOf(b.k));
G={phase:'charleston',lvl:G.lvl,dealer:G.dealer,hints:G.hints,opt:o,N,per,brk,seed,used:0,bm:false,wall:w.map(mkT),hands,disc:[],cur:G.dealer,sel:[],last:null,claim:null,msg:'',pre:'',chs:0,res:null};for(const k in MARK)delete MARK[k];CARD.forEach((S,i)=>CLOSED[i]=true);saveClosed();render()}
/* Charleston: first round right, across, left; then everyone votes; if all agree, second round left, across, right */
const CH=[['right',1],['across',2],['left',3],['left',3],['across',2],['right',1]];
/* Charleston passes. Blind pass: on the third pass of each Charleston (first left, second right) a player may pass fewer than 3
   of their own tiles and make up the rest, unseen, from the 3 tiles coming to them, sending those straight on. */
const blindOK=()=>G.chs==2||G.chs==5;
function pass(){const g=G;if(g.phase!='charleston')return;const bl=blindOK();if(g.sel.length>3||(!bl&&g.sel.length!=3))return;
const dd=CH[g.chs][1],giver=i=>(i-dd+4)%4,own=[g.sel.map(id=>g.hands[0].find(t=>t.id==id))];
for(let i=1;i<4;i++){let r=g.hands[i].slice(),o=[],n=3;if(bl){const d=best(r)[1];n=d<=5?1:d<=7?2:3}
 for(let j=0;j<n;j++){const t=pick(r,false)||r.find(t=>t.k!='J');r=r.filter(u=>u!==t);o.push(t)}own[i]=o}
const P=own.map(o=>o.slice()),done=own.map(o=>o.length==3),stolen=[[],[],[],[]];
for(let guard=0;guard<8&&done.includes(false);guard++){let prog=false;
 for(let i=0;i<4;i++){if(done[i])continue;const j=giver(i);if(!done[j])continue;
  const inc=P[j].slice(),need=3-P[i].length;for(let k=0;k<need;k++){const t=inc.splice(Math.random()*inc.length|0,1)[0];stolen[i].push(t);P[i].push(t)}done[i]=prog=true}
 if(!prog){/* everyone is waiting on someone: a bot gives up its blind pass first, never you */let i=[1,2,3].filter(k=>!done[k]).sort((x,y)=>(3-P[x].length)-(3-P[y].length))[0];if(i==null)i=0;let r=g.hands[i].filter(t=>!P[i].includes(t));while(P[i].length<3){const t=pick(r,false)||r.find(t=>t.k!='J');r=r.filter(u=>u!==t);P[i].push(t)}own[i]=P[i].slice();done[i]=true}}
for(let i=0;i<4;i++)g.hands[i]=g.hands[i].filter(t=>!own[i].includes(t));

<div class="felt">${over&&g.res?winHTML(g.res):''}${over&&!g.res?'<div class="drawov" aria-label="Draw game">DRAW</div>':''}<div class="fmt">Game <b>${SET.n+1}</b> of 4 · ${o.table=='messy'?'Pile':'Wall'}: <b>${g.wall.length}</b> · ${optLine(o)}${g.used?' · blanks traded: '+g.used:''}</div><div class="tbl">${bots}<div class="mid">${centerHTML()}${flashHTML()}</div>${me}</div>
${g.msg?`<div class="sm msg">${g.msg}</div>`:''}
<div class="bar">${ctl}</div></div>${res}<div class="bar"><button class="b g" onclick="G.phase='menu';render()">Menu</button><button class="b g" onclick="sortRack()">Sort my rack</button></div>`;layoutPile();sizePool()}

/* ---- drag a tile along your rack and drop it first, last, or between any two tiles (a yellow bar shows where it will land).
   Works with mouse, pen or finger, at any point in the game. ---- */
const DR={id:null,on:false};
function dDown(e,id){if(e.button>0)return;DR.id=id;DR.x=e.clientX;DR.y=e.clientY;DR.on=false;DR.el=e.currentTarget;DR.tg=null;DR.after=false;DR.sw=null;DR.js=null;
 const t=G.hands&&G.hands[0].find(u=>u.id==id);DR.blank=!!(t&&t.k=='X'&&G.phase=='play');DR.jk=t&&t.k!='J'&&t.k!='X'&&myTurn()?t.k:null}
function dJoker(el){if(DR.js&&DR.js!==el)DR.js.classList.remove('swapon');DR.js=el;if(el)el.classList.add('swapon')}
function dSwap(el){if(DR.sw&&DR.sw!==el)DR.sw.classList.remove('swapon');DR.sw=el;if(el)el.classList.add('swapon')}
function dMark(t,after){if(DR.tg)DR.tg.classList.remove('insL','insR');DR.tg=t;DR.after=after;if(t)t.classList.add(after?'insR':'insL')}
function dClear(){dMark(null,false);dSwap(null);dJoker(null);const on=DR.on;DR.id=null;DR.on=false;return on}
addEventListener('pointermove',e=>{if(DR.id==null)return;const dx=e.clientX-DR.x,dy=e.clientY-DR.y;
 if(!DR.on){if(Math.hypot(dx,dy)<6)return;DR.on=true;DR.el.classList.add('drag')}
 e.preventDefault();DR.el.style.transform=`translate(${dx}px,${dy}px)`;
 const rack=DR.el.closest('.r-bottom'),R=rack.getBoundingClientRect(),x=e.clientX,y=e.clientY;
 if(DR.jk){const u=document.elementFromPoint(x,y),d=u&&u.closest('[data-xj]'),j=d&&jokerOwner(+d.dataset.xj)[1];dJoker(j&&j.xk==DR.jk?d:null);if(DR.js)return dMark(null,false)}
 if(DR.blank){const u=document.elementFromPoint(x,y),d=u&&u.closest('.pool [data-did]'),t=d&&G.disc.find(v=>v.id==+d.dataset.did);dSwap(t&&swapOK(t)?d:null);if(DR.sw)return dMark(null,false)}
 if(x<R.left-60||x>R.right+60||y<R.top-70||y>R.bottom+40)return dMark(null,false);
 /* nearest tile: same row first (vertical distance), then horizontal distance; drop before or after it by which half the pointer is over */
 let bt=null,bs=1e9;for(const t of rack.querySelectorAll('.t')){if(t===DR.el)continue;const r=t.getBoundingClientRect(),vy=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0,vx=x<r.left?r.left-x:x>r.right?x-r.right:0,sc=vy*1000+vx;if(sc<bs){bs=sc;bt=t}}
 if(!bt)return dMark(null,false);const r=bt.getBoundingClientRect();dMark(bt,x>r.left+r.width/2)},{passive:false});
addEventListener('pointerup',()=>{if(DR.id==null)return;const id=DR.id,tg=DR.tg,after=DR.after,sw=DR.sw,js=DR.js;if(!dClear())return;
 DR.skip=true;setTimeout(()=>DR.skip=false,0);
 if(js){DR.pend=false;if(!jokerSwap(+js.dataset.xj,id))render();return}
 if(sw){DR.pend=false;if(!blankSwap(+sw.dataset.did,id))render();return}
 if(tg&&G.hands){const all=G.hands[0],me=all.find(t=>t.id==id),hid=all.filter(t=>!t.x&&t!==me),k=hid.findIndex(t=>t.id==+tg.dataset.id);
  if(me&&k>=0){hid.splice(after?k+1:k,0,me);G.hands[0]=[...hid,...all.filter(t=>t.x)]}}
 DR.pend=false;render()});
addEventListener('pointercancel',()=>{if(DR.id==null)return;dClear();DR.pend=false;render()});
function sortRack(){G.hands[0].sort((a,b)=>ORDER.indexOf(a.k)-ORDER.indexOf(b.k));render()}

/* ---- a bot's seat: rack along its side of the table (backs until the game ends), exposures toward the middle ---- */
const POS={1:'right',2:'top',3:'left'};
function seatHTML(i,over){const g=G,H=g.hands[i],ex=exOrder(H),hid=H.filter(t=>!t.x),pos=POS[i],v=pos!='top';
const face=t=>v?`<span class="rot r${pos=='left'?90:-90}">${tile(t,{m:1})}</span>`:tile(t,{m:1});
const ld=g.lastDraw&&g.lastDraw.p==i&&hid.includes(g.lastDraw.t)?g.lastDraw.t:null,fr=ld&&freshAge(ld)<2000;
const rack=`<div class="rack ${v?'v':'h'} r-${pos}${g.dealer==i?' dealer':''}" aria-label="${NAMES[i]}'s rack, ${hid.length} tiles">${over?hid.map(face).join(''):`<span class="bk${v?' v':''}"></span>`.repeat(Math.max(0,hid.length-(fr?1:0)))+(fr?`<span class="bk${v?' v':''} fresh"${freshAttr(ld)}></span>`:'')}</div>`;
const xs=ex.length?`<div class="xs ${v?'xcol':'xrow'}">${ex.map(face).join('')}</div>`:'';
const tag=`<div class="tag">${NAMES[i]}${g.dealer==i?' <span class="dl">East · dealer</span>':''}</div>`;
return `<div class="seat st${i} ${pos}"><div class="sbody">${pos=='right'?xs+rack+tag:tag+rack+xs}</div></div>`}

/* ---- Messy pile: every tile gets its own grid cell (random cell, random turn, jitter that keeps it inside the cell), so no two tiles ever overlap.
   The layout is seeded per game, so tiles stay put between turns; drawn tiles simply disappear. ---- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function layoutPile(){const el=document.querySelector('.pile');if(!el||!G.wall)return;const g=G,N=g.N,n=g.wall.length;el.style.minHeight='';
let W=el.clientWidth,H=el.clientHeight,c=46;while(c>26&&Math.floor(W/c)*Math.floor(H/c)<N)c--;
const cols=Math.max(1,Math.floor(W/c));let rows=Math.floor(H/c);if(cols*rows<N){rows=Math.ceil(N/cols);H=rows*c;el.style.minHeight=H+'px'}
const ox=(W-cols*c)/2,oy=(H-rows*c)/2,R=rng(g.seed),cells=[...Array(cols*rows).keys()];
for(let i=cells.length-1;i>0;i--){const j=R()*(i+1)|0;[cells[i],cells[j]]=[cells[j],cells[i]]}
const tw=c*.46,th=c*.64;let out='';
for(let i=0;i<N;i++){const q=cells[i],r=R()*360|0,a=r*Math.PI/180,cs=Math.abs(Math.cos(a)),sn=Math.abs(Math.sin(a)),bw=tw*cs+th*sn,bh=tw*sn+th*cs,jx=R(),jy=R();if(i>=n)continue;
 const x=ox+(q%cols)*c+c/2+(jx-.5)*(c-bw),y=oy+Math.floor(q/cols)*c+c/2+(jy-.5)*(c-bh);
 out+=`<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${tw.toFixed(1)}px;height:${th.toFixed(1)}px;margin:${(-th/2).toFixed(1)}px 0 0 ${(-tw/2).toFixed(1)}px;font-size:${(tw*.3).toFixed(1)}px;transform:rotate(${r}deg)"></i>`}
el.innerHTML=out}
addEventListener('resize',()=>{if(G.phase=='menu')return;if(G.opt.table=='messy')layoutPile();sizePool()});
/* discard tiles: pick the biggest size at which every tile that could ever be discarded this game (all tiles minus four 13-tile hands and the last draw)
   fits in the middle of the table, so a full pool nearly fills it */
function sizePool(){const el=document.querySelector('.pool');if(!el||!G.N)return;const M=Math.max(20,G.N-53),cs=getComputedStyle(el);
 const W=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=el.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);if(W<=0||H<=0)return;
 let h=66;for(;h>=18;h-=.5){const w=h*.714,cols=Math.floor((W+.01)/(w+2)),rows=Math.floor((H+.01)/(h+2));if(cols*rows>=M)break}
 el.style.setProperty('--dh',h+'px');el.style.setProperty('--dw',(h*.714).toFixed(2)+'px')}

/* ---- center of the table: walls or a messy pile, with the discards ---- */
function centerHTML(){const g=G,pool=`<div class="pool">${g.disc.map((t,i)=>tile(t,{m:1,last:i==g.disc.length-1,take:g.bm&&swapOK(t),did:1,pick:i==g.disc.length-1&&g.cw&&g.cw.wait})).join('')||'<span class="sm">Discards appear here</span>'}</div>`;
if(g.opt.table=='messy'){const n=g.wall.length;return `<div class="messy"><div class="pile" role="img" aria-label="${n} face-down tiles"></div>${pool}</div>`}
const N=g.N,tot=Math.ceil(N/2),per=g.per,drawn=N-g.wall.length,W=[[],[],[],[]],ns=Math.floor(drawn/2),cw=g.cw,glow=!!cw&&g.wall.length>0,can=glow&&cw.wait;
for(let q=0;q<4*per;q++){const s=(q-g.brk+4*per)%(4*per),size=s<tot?Math.min(2,N-2*s):0,rem=size-Math.max(0,Math.min(size,drawn-2*s));W[WO[Math.floor(q/per)]].push({r:rem,nx:glow&&s==ns&&rem>0})}
/* while a discard is up for grabs, the next tile to be drawn glows too; on your call, clicking it = pass (and draw, if you're next) */
const nxt=cw?(cw.from+1)%4:-1,wt=nxt==0?'Pass and draw this tile':'Pass – '+(NAMES[nxt]||'')+' draws this tile';
const st=a=>a.map(o=>o.nx?`<i class="k${o.r} nx${can?' can':''}" ${can?`onclick="myClaim('pass')" title="${wt}"`:''}></i>`:`<i class="k${o.r}"></i>`).join('');
return `<div class="walls" role="img" aria-label="Walls: ${g.wall.length} tiles left"><div class="w wt">${st(W[2])}</div><div class="w wl">${st(W[3].slice().reverse())}</div>${pool}<div class="w wr">${st(W[1])}</div><div class="w wb">${st(W[0].slice().reverse())}</div></div>`}

/* ---- the card itself ---- */
const COLC={b:'cb',r:'cr',g:'cg',k:'ck'};
const segHTML=s=>/^[+x=]$/.test(s.txt)?`<span class="op ck">${s.txt=='x'?'×':s.txt}</span>`:`<span class="${COLC[s.col]}">${s.txt}</span>`;
const altHTML=alt=>`<span class="alt">${alt.map(tok=>tok.map(segHTML).join('')).join(' ')}</span>`;
/* hands you tick on the card (highlighted); cleared at every new deal */
const MARK={};
function togMark(id,on){if(on)MARK[id]=1;else delete MARK[id];renderCard()}
/* which categories are closed; remembered in this browser */
const CLOSED=(()=>{try{return JSON.parse(localStorage.getItem('mcClosedCats')||'{}')}catch(e){return {}}})();
function saveClosed(){try{localStorage.setItem('mcClosedCats',JSON.stringify(CLOSED))}catch(e){}}
function togCat(k,e){if(e)e.stopPropagation();CLOSED[k]=!CLOSED[k];saveClosed();renderCard()}
function allCats(shut){CARD.forEach((S,i)=>CLOSED[i]=shut);CLOSED.rules=shut;saveClosed();renderCard()}
/* a card line is dead when none of its versions can still be made: a pair or single needs more natural tiles than are left
   (4 of each kind, 8 flowers, minus discards and other players' exposures; each blank you hold can win back one discard),
   a part needs more than naturals + jokers left, your exposed sets don't fit it, or it's concealed and you've exposed */
function deadHands(){const g=G,me=g.hands[0],out={},seen={},myX=me.filter(t=>t.x),myBl=me.filter(t=>t.k=='X'&&!t.x).length;
 const TOT=k=>k=='F'?8:k=='J'?8+g.opt.xj:4;
 g.disc.forEach(t=>seen[t.k]=(seen[t.k]||0)+1);for(let p=1;p<4;p++)g.hands[p].forEach(t=>{if(t.x)seen[t.k]=(seen[t.k]||0)+1});
 const jokAvail=TOT('J')-g.disc.filter(t=>t.k=='J').length,discBy=k=>g.disc.filter(t=>t.k==k).length;
 const sets={};myX.forEach(t=>{const id=t.xs||('k'+t.k);(sets[id]=sets[id]||{k:t.xk||t.k,n:0}).n++});const xs=Object.values(sets);
 const alive=new Set();
 for(const t of T){if(alive.has(t.id))continue;if(xs.length&&t.c)continue;let ok=true;
  for(const s of xs){const e=t.m.find(([k])=>k==s.k);if(!e||e[2]<s.n){ok=false;break}}
  if(ok)for(const[k,n,j]of t.m){const nat=Math.min(TOT(k),TOT(k)-(seen[k]||0)+Math.min(myBl,discBy(k)));if(nat<n-j||nat+jokAvail<n){ok=false;break}}
  if(ok)alive.add(t.id)}
 HANDS.forEach(H=>{if(!alive.has(H.id))out[H.id]=1});return out}
function renderCard(){const near={},inGame=G.hands&&G.phase!='menu',rail=document.getElementById('rail');
const dead={};if(inGame&&G.phase!='dice')Object.assign(dead,deadHands());
if(inGame){const c=cnt(G.hands[0]),ex=G.hands[0].some(t=>t.x);T.forEach(t=>{if(ex&&t.c)return;const d=dist(t,c);if(near[t.id]==null||d<near[t.id])near[t.id]=d})}
/* keep each category's scroll position across re-renders */
const keep={rail:rail.scrollTop};rail.querySelectorAll('.cat').forEach(el=>keep[el.dataset.k]=el.querySelector('.body').scrollTop);
const head=(k,title,sub)=>{const shut=!!CLOSED[k];return `<div class="sh" onclick="togCat('${k}')"><h3>${title}</h3>${sub}<button class="x" aria-expanded="${!shut}" aria-label="${shut?'Open':'Close'} ${title}" title="${shut?'Open':'Close'}" onclick="togCat('${k}',event)">${shut?'+':'✕'}</button></div>`};
const sec=(S,k)=>{const shut=!!CLOSED[k],hot=S.h.filter(H=>near[H.id]!=null&&near[H.id]<=3).length,mk=S.h.filter(H=>MARK[H.id]).length;
 const sub=shut?`<span class="cnt">${S.h.length} hands${hot?` · ${hot} within 3`:''}${mk?` · <span class="mkn">${mk} ticked</span>`:''}</span>`:(S.q?`<span>${S.q}</span>`:'<span></span>');
 return `<section class="cat${shut?' shut':''}${mk?' hasmk':''}" data-k="${k}">${head(k,S.sec,sub)}<div class="body">${S.h.map(H=>{const d=near[H.id];
 return `<div class="ln${H.c?' c':''}${dead[H.id]?' dead':''}${d!=null&&d<=3&&!dead[H.id]?' hot':''}${MARK[H.id]?' mk':''}"><input type="checkbox" class="mkb" aria-label="Highlight ${S.sec} hand ${H.line}" ${MARK[H.id]?'checked':''} onchange="togMark(${H.id},this.checked)"><span class="no">${H.line}</span><div class="hd">${H.alts.map(altHTML).join('<span class="or">or</span>')}${H.n?`<span class="nt">(${H.n})</span>`:''}${d!=null?`<span class="togo">${d} to go</span>`:''}</div><span class="val">${H.c?'C':''}${H.p}</span></div>`}).join('')}</div></section>`};
const rules=`<section class="cat${CLOSED.rules?' shut':''}" data-k="rules">${head('rules','Card rules','<span></span>')}<div class="body"><div class="rules">Soap used as zero (0) may be used with any suit.<br>Winning without exposures earns +10, except hands marked C.<br>C next to the value means a concealed hand.</div></div></section>`;
rail.innerHTML=`<div class="rail-hd"><b>Big Card 2026</b><div class="rail-tools"><button onclick="allCats(false)">Open all</button><button onclick="allCats(true)">Close all</button></div><span><span class="cr">Red</span> <span class="cg">Green</span> <span class="cb">Blue</span> = suits · F Flower · D Dragon · 0 Soap${inGame?' · green = within 3 tiles · yellow = ticked · red = dead hand':''}</span></div>${CARD.map(sec).join('')}${rules}`;
rail.scrollTop=keep.rail;rail.querySelectorAll('.cat').forEach(el=>{if(keep[el.dataset.k])el.querySelector('.body').scrollTop=keep[el.dataset.k]})}
render();
</script>
</body></html>
