 const ts=ids.map(id=>g.hands[s].find(t=>t.id===id&&t.k!='J'&&t.k!='X'&&!t.x)).filter(Boolean);if(new Set(ts).size!=ids.length||ts.length>3||(!bl&&ts.length!=3))return;

function doPass(){const g=G,bl=blindOK();
const dd=CH[g.chs][1],giver=i=>(i-dd+4)%4,own=[0,1,2,3].map(i=>isHuman(i)?g.chsel[i]:null);

  :`You passed ${CH[g.chs-1][0]} to ${NAMES[(q+dd)%4]} and got 3 tiles from ${from} (added at the right end of your rack).`)+(oth.length?` Blind passes: ${oth.join(', ')}.`:'')}

function exOrder(H){const ex=H.filter(t=>t.x);if(!ex.length)return ex;const b=best(H)[0],pos=k=>{const i=b?b.g.findIndex(([kk])=>kk==k):-1;return i<0?99:i};
 const sets={};ex.forEach(t=>{const id=t.xs||('k'+t.k);(sets[id]=sets[id]||{k:t.xk||t.k,ts:[]}).ts.push(t)});
 return Object.values(sets).sort((a,b2)=>pos(a.k)-pos(b2.k)).flatMap(o=>o.ts.sort((a,b2)=>(a.k=='J')-(b2.k=='J')))}
/* a hand can only earn the jokerless double if jokers could have been used in it: it needs a group of 3 or more
   (singles and pairs can't take jokers), and Singles and Pairs hands never qualify */
const jokerOK=b=>!!b&&b.m.some(x=>x[2]>0)&&!/singles/i.test((HANDS[b.id]||{}).sec||'');
function end(w,self,from,shown){const g=G;g.phase='over';g.cw=null;g.pd=null;g.bm=false;g.cur=-1;let r=null;
/* scoring: only the winner scores (doubled if the winning hand has no jokers) — the hand's value (+10 for no exposures, except C hands, as the card says), +10 more for a self-pick.
   On a win from a discard, the discarder loses 10 if the winner had 0 or 1 sets exposed when it was thrown, or 20 if the winner had 2 or more. Everyone else: 0. */
if(w>=0){const b0=best(g.hands[w])[0],al=b0&&siamAlloc(b0,g.hands[w],0);if(al){const ord=cardOrder(al,b0);g.hands[w]=ord.concat(g.hands[w].filter(u=>!ord.includes(u)))}const b=b0,bonus=(!b.c&&!g.hands[w].some(t=>t.x))?10:0,sp=self?10:0,jl=!g.hands[w].some(t=>t.k=='J')&&jokerOK(b),p=(b.p+bonus+sp)*(jl?2:1),d=[0,0,0,0];d[w]=p;
 let pen=0;if(!self&&from!=null&&from>=0){pen=(shown||0)>=2?20:10;d[from]=-pen}
 d.forEach((x,i)=>SC[i]+=x);r={jl,w,b,p,base:b.p,bonus,sp,self,from,pen,shown:shown||0,d}}
g.res=r;render()}
function setLvl(l){G.lvl=l;saveSettings();render()}
function setOpt(k,v){const o=G.opt;if(k=='mode'){if(o.mode!=v){o.mode=v;SC.fill(0);SET.n=0}}else if(k=='table')o.table=v;else if(k=='card'){o.card=v;if(useCard(v))cardReset()}else o[k]=Math.max(0,Math.min(8,o[k]+v));saveSettings();render()}
const optLine=o=>`${o.mode=='siam'?'Siamese (1-on-1) · ':''}${CARDS[CARDID].short} · ${o.table=='messy'?'Messy':'Show Walls'} · ${o.blanks} blank${o.blanks==1?'':'s'} · ${o.xj?'+'+o.xj+' jokers':'no extra jokers'}`;

let MODE='solo';const RS={};let HU=[1,0,0,0];
const isHuman=s=>s==0||(MODE=='guest'?!!HU[s]:!!RS[s]);
const waitNames=f=>[0,1,2,3].filter(i=>isHuman(i)&&f(i)).map(i=>i==0?'you':NAMES[i]).join(' and ');
function dealOrRoll(){if(MODE=='guest')return;if(SET.n==0)startSet();else newGame()}
function nextG(){if(MODE=='guest')return;SET.n++;if(SET.n>=4){SET.n=0;return startSet()}G.dealer=(G.dealer+(SIAM()?2:1))%4;newGame()}
function startSet(){if(MODE=='guest')return;seatPending();const g=G;g.phase='dice';g.east=null;g.tie=false;let d,tries=0;
 do{d=[0,1,2,3].map(()=>1+Math.random()*6|0);if(SIAM())d[1]=d[3]=0;if(d.filter(x=>x==Math.max(...d)).length>1)g.tie=true}while(d.filter(x=>x==Math.max(...d)).length>1&&++tries<50);
 let n=0;const tick=setInterval(()=>{if(G!==g||g.phase!='dice'){clearInterval(tick);return}
  g.face=[0,1,2,3].map(()=>1+Math.random()*6|0);if(++n>=11){clearInterval(tick);g.face=d;g.dice=d;g.east=d.indexOf(Math.max(...d))}render()},95);

function beginSet(){if(MODE=='guest')return;G.dealer=G.east;SET.n=0;newGame()}

/* ===== Siamese (1-on-1) – v146 =====
   You against one bot (the player across). Each player holds 27 tiles (28 on their turn) on two racks and builds two hands.
   No Charleston. Concealed tiles move freely between your racks (drag them); exposures stay on the rack they were made for.
   Completing a hand: its 14 tiles are laid out on its rack and locked (jokers in it can no longer be swapped). The game ends when
   a player completes their second hand. Scoring: 1st hand = card value, the game-ending hand ×2 (both ×2 if both finish at once),
   jokerless ×2 as in Traditional. Throwing the tile that finishes your opponent's second hand costs 25. */
const SIAM=()=>!!(G.opt&&G.opt.mode=='siam');
const HN=()=>SIAM()?27:13;
const SEATS=()=>SIAM()?[0,2]:[0,1,2,3];
const rk=t=>t.r||0;
const concT=h=>h.filter(t=>!t.x);
const lockedR=(h,r)=>h.some(t=>t.lk&&rk(t)==r);
const exR=(h,r)=>h.filter(t=>t.x&&!t.lk&&rk(t)==r);
const freeR=h=>[0,1].filter(r=>!lockedR(h,r));
const RKN=['top rack','bottom rack'];
/* best card hand that the tiles in pool can make while keeping rack exposures ex */
function siamFit(pool,ex){const c=cnt(pool),hasEx=ex.length>0,groups={};let bt=null;
 ex.forEach(t=>{const id=t.xs;(groups[id]=groups[id]||{k:t.xk,n:0}).n++});
 for(const t of T){if(hasEx&&t.c)continue;if(dist(t,c))continue;
  if(Object.values(groups).some(gp=>!t.m.some(([k,n])=>k==gp.k&&n>=gp.n)))continue;
  if(!bt||t.p>bt.p)bt=t}
 return bt}
/* pick the actual 14 tiles for target t from pool (exposures first, then real tiles – preferring rack r – then jokers) */
function siamAlloc(t,pool,r,partial){const used=new Set(),need={};
 for(const[k,n]of t.m){let q=n;
  for(const u of pool){if(!q)break;if(!used.has(u)&&u.x&&(u.xk||u.k)==k){used.add(u);u._k=k;q--}}
  const real=pool.filter(u=>!used.has(u)&&!u.x&&u.k==k).sort((a,b)=>(rk(b)==r)-(rk(a)==r));
  for(const u of real){if(!q)break;used.add(u);u._k=k;q--}
  need[k]=q}
 for(const[k,n,j]of t.m){let q=Math.min(need[k],j);if(!q)continue;
  const jk=pool.filter(u=>!used.has(u)&&!u.x&&u.k=='J').sort((a,b)=>(rk(b)==r)-(rk(a)==r));
  for(const u of jk){if(!q)break;used.add(u);u._k=k;q--;need[k]--}}
 if(!partial&&Object.values(need).some(q=>q>0))return null;
 return [...used]}
/* what s could complete now (extra = a discard being considered) */
function siamOpts(s,extra){const h=G.hands[s],cc=concT(h).concat(extra?[extra]:[]),fr=freeR(h),one=[];
 for(const r of fr){const ex=exR(h,r),t=siamFit(cc.concat(ex),ex);if(t)one.push({r,t})}
 /* two complete hands at once: try every hand the tiles could make on one rack, and see if what is left completes the other */
 let both=null,bs=-1;
 if(fr.length==2&&cc.length+exR(h,0).length+exR(h,1).length==28)for(const r of [0,1]){const ex=exR(h,r),pool=cc.concat(ex),c=cnt(pool);
  for(const t of T){if(ex.length&&t.c)continue;if(dist(t,c))continue;const tiles=siamAlloc(t,pool,r);if(!tiles||tiles.length!=14)continue;
   const rest=cc.filter(u=>!tiles.includes(u)),ex2=exR(h,1-r);if(rest.length+ex2.length!=14)continue;
   const t2=siamFit(rest.concat(ex2),ex2);if(t2&&t.p+t2.p>bs){bs=t.p+t2.p;both=[{r,t},{r:1-r,t:t2}]}}}
 return {one,both}}
/* ---- the player's Mahjong is read from the tiles actually on a rack (plus its exposure line) ---- */
const rackPool=(h,r,extra)=>concT(h).filter(u=>rk(u)==r).concat(extra?[extra]:[],exR(h,r));
function rackFits(h,r,extra){if(lockedR(h,r))return [];const ex=exR(h,r),pool=rackPool(h,r,extra);if(pool.length!=14)return [];
 const c=cnt(pool),groups={};ex.forEach(t=>{(groups[t.xs]=groups[t.xs]||{k:t.xk,n:0}).n++});
 return T.filter(t=>!(ex.length&&t.c)&&!dist(t,c)&&!Object.values(groups).some(gp=>!t.m.some(([k,n])=>k==gp.k&&n>=gp.n))).sort((a,b)=>b.p-a.p)}
/* start a Mahjong for the player on the given racks (extra = claimed discard, which goes on rack xr) */
function startMJ(racks,self,from,extra,xr){const g=G,h=g.hands[0];
 g.mjq={self,from,extra,xr,todo:racks.map(r=>{const ex=r===xr?extra:null,pool=rackPool(h,r,ex),c=rackFits(h,r,ex);
  return {r,c,js:c.map(t=>{const al=siamAlloc(t,pool,r)||[];return al.filter(u=>u.k=='J'&&!u.x).map(u=>u._k).sort()}),pk:[]}})};
 nextMJ()}
const jsig=a=>a.join(',');
function nextMJ(){const g=G,q=g.mjq;if(!q)return;
 for(const it of q.todo){if(it.t)continue;
  if(new Set(it.js.map(jsig)).size<=1){it.t=it.c[0];continue}
  q.ask=it;g.msg='Which tile are your jokers playing on the '+RKN[it.r]+'? Tap it in the Tile Key.';render();renderKey();return}
 q.ask=null;finishMJ()}
function mjKey(k){const g=G,q=g.mjq,it=q&&q.ask;if(!it)return;const pk=it.pk.concat([k]);
 const has=js=>{const a=js.slice();return pk.every(x=>{const i=a.indexOf(x);if(i<0)return false;a.splice(i,1);return true})};
 const keep=it.c.map((t,i)=>i).filter(i=>has(it.js[i]));
 if(!keep.length){it.miss=tname(k);render();renderKey();return}
 it.miss=null;it.c=keep.map(i=>it.c[i]);it.js=keep.map(i=>it.js[i]);it.pk=pk;
 if(new Set(it.js.map(jsig)).size<=1){it.t=it.c[0];q.ask=null;renderKey();return nextMJ()}
 render();renderKey()}
function mjCancel(){const g=G,q=g.mjq;if(!q)return;g.mjq=null;renderKey();
 if(q.extra){g.pre='You let the '+tname(q.extra.k)+' go – ';return nx(q.from)}g.msg='Mahjong cancelled – rearrange or discard.';render()}
function finishMJ(){const g=G,q=g.mjq,h=g.hands[0];g.mjq=null;renderKey();
 if(q.extra){g.disc.pop();q.extra.r=q.xr;h.push(q.extra);g.cur=0}
 siamMJ(0,q.todo.map(it=>({r:it.r,t:it.t,pool:rackPool(h,it.r)})),q.self,q.from)}
function mjAskHTML(){const it=G.mjq.ask;return `<span><b>Mahjong on your ${RKN[it.r]}:</b> tap the tile your jokers are playing in the Tile Key.</span><button class="b g" onclick="mjCancel()">Cancel</button>`}
function mjKeyHead(){const it=G.mjq.ask;return `<div class="tkhd"><b>Mahjong on your ${RKN[it.r]} – which ${it.pk.length?'other ':''}pung, kong or quint are your jokers playing?</b><button class="x" aria-label="Cancel" onclick="mjCancel()">✕</button></div>
 <div class="mjq">Tap that tile below.${it.pk.length?' So far: '+it.pk.map(tname).join(', ')+'.':''}
 ${it.miss?`<div class="mjmiss">None of the hands your tiles make use jokers as the ${it.miss} – try another tile.</div>`:''}
 <div class="mut">Your tiles could be: ${it.c.map(t=>t.n+' ('+t.p+')').join(' · ')}</div></div>`}
/* lock a completed hand onto rack r */
function siamLock(s,r,t,pl){const g=G,h=g.hands[s],pool=pl||concT(h).concat(exR(h,r)),tiles=siamAlloc(t,pool,r);if(!tiles)return false;cardOrder(tiles,t);
 tiles.forEach(u=>{u.x=true;u.lk=true;u.r=r;u.xs='L'+s+'-'+r;u.xk=u._k||u.k});
 concT(h).forEach(u=>{if(rk(u)==r)u.r=1-r});
 g.sm=g.sm||{};g.sm[s]=g.sm[s]||{};g.sm[s][r]={t,jl:!tiles.some(u=>u.k=='J')&&jokerOK(t)};return true}
/* declare Mahjong on one or both racks; ends the game when both of s's racks are complete */
function siamMJ(s,list,self,from){const g=G,h=g.hands[s];
 for(const o of list){if(!siamLock(s,o.r,o.t,o.pool))return false}
 if(!freeR(h).length){list.forEach(o=>g.sm[s][o.r].final=true);return siamWin(s,list.length==2,self,from)}
 const o=list[0];g.flash={txt:`${s==0?'You':NAMES[s]} – Mahjong on the ${RKN[o.r]}!<small>${o.t.n} · one hand to go</small>`,t:Date.now()};
 g.cur=s;g.pd=null;
 if(s==0){g.msg='First hand complete ('+o.t.n+') – it’s locked on your '+RKN[o.r]+'. Now discard a tile.';return render()}
 g.msg=NAMES[s]+' completed a hand on the '+RKN[o.r]+'.';render();
 setTimeout(()=>{if(G!==g||g.phase!='play')return;discard(s,siamPick(s))},900);return true}
function siamWin(w,both,self,from){const g=G,st=g.sm[w],lines=[];let tot=0;
 for(const r of [0,1]){const e=st[r];if(!e)continue;let p=e.t.p;const notes=[];
  if(both)notes.push('×2 both hands at once'),p*=2;else if(e.final)notes.push('×2 game-ending hand'),p*=2;
  if(e.jl)notes.push('×2 jokerless'),p*=2;tot+=p;lines.push({n:e.t.n,base:e.t.p,p,notes,r,final:!!e.final})}
 const d=[0,0,0,0];d[w]=tot;let pen=0;if(!self&&from!=null&&from>=0){pen=25;d[from]=-pen}
 /* the other player still scores any Mahjong they have already exposed (jokerless doubles) */
 const L=SEATS().find(x=>x!=w),ll=[];let lt=0;for(const r of [0,1]){const e=g.sm[L]&&g.sm[L][r];if(!e)continue;let p=e.t.p;const notes=[];if(e.jl)notes.push('×2 jokerless'),p*=2;lt+=p;ll.push({n:e.t.n,base:e.t.p,p,notes,r})}
 d[L]+=lt;
 d.forEach((x,i)=>SC[i]+=x);const fin=lines.find(l=>l.final)||lines[0];
 g.phase='over';g.cw=null;g.pd=null;g.bm=false;g.cur=-1;g.res={w,b:st[fin.r].t,p:tot,siam:lines,pen,from,self,d,L,ll,lt};render();return true}
/* bot discard: keep the two hands it is closest to */
function siamScore(pool){const[a,da]=best(pool);if(!a)return 99;const used=siamAlloc(a,pool,0,true),rest=pool.filter(u=>!used.includes(u));return da+best(rest)[1]}
function siamPick(s){const g=G,h=g.hands[s],cc=concT(h),fr=freeR(h);
 if(fr.length==1)return pick(cc.concat(exR(h,fr[0])),g.lvl=='easy')||cc.find(u=>u.k!='J')||cc[0];
 const cand=cc.filter(t=>t.k!='J');if(!cand.length)return cc[0];
 if(g.lvl=='easy'&&Math.random()<.35)return cand[Math.random()*cand.length|0];
 let bt=null,bs=1e9;const seen={};for(const t of cand){if(seen[t.k])continue;seen[t.k]=1;const sc=siamScore(cc.filter(u=>u!==t))+(t.k=='X'?-.5:0);if(sc<bs){bs=sc;bt=t}}
 return bt||cand[0]}
function siamBotTurn(s){const g=G,o=siamOpts(s);
 if(o.both)return siamMJ(s,o.both,true,null);
 if(o.one.length)return siamMJ(s,[o.one[0]],true,null);
 g.msg=(g.pre||'')+NAMES[s]+' is thinking…';g.pre='';render();
 setTimeout(()=>{if(g!==G||g.phase!='play')return;discard(s,siamPick(s))},700)}
/* a claimed discard that completes a hand */
function siamClaimWin(w,t,from){const g=G,h=g.hands[w];
 if(w==0){const xr=freeR(h).find(r=>rackFits(h,r,t).length);if(xr==null){g.pre='';return nx(from)}
  const racks=[xr];if(g.mjN==2&&!lockedR(h,1-xr)&&rackFits(h,1-xr).length)racks.push(1-xr);g.mjN=null;return startMJ(racks,false,from,t,xr)}
 g.disc.pop();const o=siamOpts(w,t);
 const fr=freeR(h);t.r=(o.both?o.both[0].r:o.one.length?o.one[0].r:fr[0]);h.push(t);g.cur=w;
 const o2=siamOpts(w);if(o2.both)return siamMJ(w,o2.both,false,from);
 const pickO=o2.one.find(x=>siamAlloc(x.t,concT(h).concat(exR(h,x.r)),x.r).includes(t))||o2.one[0];
 if(!pickO){g.pre='';return go()}
 return siamMJ(w,[pickO],false,from)}
function myMJ(r){const g=G,h=g.hands[0];if(!SIAM()||g.phase!='play'||g.cur!=0||g.cw||g.mjq||h.length!=HN()+1)return;
 const racks=r=='both'?[0,1]:[r];if(racks.every(x=>rackFits(h,x).length))startMJ(racks,true,null,null,null)}

function mjBtns(){return `<span class="mjbtns"><button class="b" onclick="claimMJ(1)">Claim 1 Mahjong</button><button class="b" onclick="claimMJ(2)">Claim 2 Mahjongs</button></span>`}
function rackWhy(h,r,extra){const n=rackPool(h,r,extra).length;return n!=14?`your ${RKN[r]} has ${n} tiles (counting its exposure line) – a hand needs 14`:`the tiles on your ${RKN[r]} don’t make a hand on the card`}
function mjNo(m){G.msg='Not a Mahjong: '+m+'.';render()}
function claimMJ(n){const g=G,h=g.hands[0];if(!SIAM()||g.phase!='play'||g.mjq||g.pd!=null)return;const fr=freeR(h),cw=g.cw;
 if(n==2&&fr.length<2)return mjNo('you have only one hand left to make – use Claim 1 Mahjong');
 if(cw){if(!(cw.wait&&cw.wp==0)){g.msg='Wait for your turn to call.';return render()}
  const t=cw.t;if(t.k=='J'||t.k=='X')return mjNo('jokers and blanks can’t be claimed');
  const xr=fr.find(r=>rackFits(h,r,t).length);
  if(xr==null)return mjNo(fr.map(r=>rackWhy(h,r,t)).join('; '));
  if(n==2&&!rackFits(h,1-xr).length)return mjNo(rackWhy(h,1-xr));
  g.mjN=n;return claimFor(0,'win')}
 if(g.cur!=0||h.length!=HN()+1){g.msg='You can call Mahjong right after you draw, or on a discard.';return render()}
 if(n==2){const bad=[0,1].filter(r=>!rackFits(h,r).length);if(bad.length)return mjNo(bad.map(r=>rackWhy(h,r)).join('; '));return startMJ([0,1],true,null,null,null)}
 const ok=fr.filter(r=>rackFits(h,r).length);if(!ok.length)return mjNo(fr.map(r=>rackWhy(h,r)).join('; '));
 if(ok.length==2){g.mjPick=true;return render()}
 startMJ([ok[0]],true,null,null,null)}
function mjPickRack(r){G.mjPick=false;if(r==null)return render();startMJ([r],true,null,null,null)}
/* Siamese default arrangement: top rack = winds (N E W S) at the left, then flowers, then odd numbers by suit with each suit's dragon
   (Soap for Dots) right after that suit's highest odd number; bottom rack = jokers and blanks at the left, then even numbers */
function siamArrange(h){const W=['wN','wE','wW','wS'];
 const key=t=>{const k=t.k,n=/^[DBC][1-9]$/.test(k)?+k[1]:0;
  if(W.includes(k))return [0,0,W.indexOf(k)];if(k=='F')return [0,1,0];if(n%2||k[0]=='d')return [0,2,ORDER.indexOf(k)];   /* dragons (incl. Soap, the Dot dragon) sit right after the highest odd number of their suit */
  if(k=='J')return [1,0,0];if(k=='X')return [1,1,0];if(n)return [1,2,ORDER.indexOf(k)];return [1,4,ORDER.indexOf(k)]};
 const cc=h.filter(t=>!t.x).map(t=>[key(t),t]).sort((a,b)=>a[0][0]-b[0][0]||a[0][1]-b[0][1]||a[0][2]-b[0][2]);
 const fr=freeR(h);cc.forEach(([kk,t])=>{t.r=fr.length==2?kk[0]:fr[0]});
 return cc.map(x=>x[1]).concat(h.filter(t=>t.x))}
/* lay a completed hand out in the card's order: each tile goes to its group (real tiles first, jokers fill in); lo = position, lg = starts a new group */
function cardOrder(tiles,t){const pool=tiles.slice(),out=[];
 t.g.forEach(([k,n],gi)=>{for(let i=0;i<n;i++){let ix=pool.findIndex(u=>u.k!='J'&&(u._k||u.xk||u.k)==k);if(ix<0)ix=pool.findIndex(u=>(u._k||u.xk)==k);if(ix<0)continue;
  const u=pool.splice(ix,1)[0];u.lo=out.length;u.lg=i==0&&gi>0;out.push(u)}});
 pool.forEach(u=>{u.lo=out.length+1;u.lg=false});return out.concat(pool)}
/* exposures for display: a completed (locked) hand in card order with a small gap between its groups */
function xsTiles(xs,face){const lk=xs.some(t=>t.lk),ts=lk?xs.slice().sort((a,b)=>(a.lo??99)-(b.lo??99)):xs;
 return ts.map(t=>(lk&&t.lg?'<span class="ggap"></span>':'')+face(t)).join('')}
/* bots take any exposed joker they can (not from a completed hand) by swapping in the real tile */
function botSwap(s){const g=G;if(g.cur!=s||g.cw||g.hands[s].length!=HN()+1)return '';
 for(let p=0;p<4;p++)for(const j of g.hands[p]){if(!(j.x&&j.k=='J'&&!j.lk))continue;const t=g.hands[s].find(u=>!u.x&&u.k==j.xk&&u.k!='J');
  if(t&&jokerFor(s,j.id,t.id))return NAMES[s]+' swapped a '+tname(t.k)+' for an exposed joker. '}
 return ''}
function myClaimRack(r){const g=G,cw=g.cw;if(!cw||!cw.rkAsk)return;const a=cw.rkAsk;cw.rkAsk=null;g.xr=r;claimFor(0,a)}

function siamRes(r){const cap=x=>x[0].toUpperCase()+x.slice(1);return `<div class="card"><b class="win">${r.w==0?'You win the game!':NAMES[r.w]+' wins the game.'} +${r.p} pts</b>${r.siam.map(l=>`<div class="mut" style="margin-top:4px">${cap(RKN[l.r])}: ${l.n} – ${l.base}${l.notes.length?' · '+l.notes.join(' · '):''} = <b>${l.p}</b></div>`).join('')}${r.pen?`<div class="mut" style="margin-top:4px">${r.from==0?'You':NAMES[r.from]} threw the game-ending tile: −${r.pen}</div>`:''}${r.ll&&r.ll.length?`<div class="mut" style="margin-top:6px"><b>${r.L==0?'Your':NAMES[r.L]+'’s'} exposed Mahjong still counts: +${r.lt}</b></div>`+r.ll.map(l=>`<div class="mut" style="margin-top:2px">${cap(RKN[l.r])}: ${l.n} – ${l.base}${l.notes.length?' · '+l.notes.join(' · '):''} = <b>${l.p}</b></div>`).join(''):''}<div>${grps(r.b)}</div><div class="bar"><button class="b" onclick="nextG()">Next game</button></div></div>`}
function siamMe(g,h,myH){const xsAll=exOrder(h);
 /* two lines of exposures in front of the racks: the top line belongs to the top-rack hand, the bottom line to the bottom-rack hand */
 const line=r=>{const xs=xsAll.filter(t=>rk(t)==r),lk=lockedR(h,r);
  return `<div class="xline${lk?' lockd':''}" title="${lk?'Completed hand (locked)':''}"><span class="xlbl">${r?'Bottom':'Top'} line${lk?' · complete':''}</span>${xs.length?xsTiles(xs,t=>tile(t,{m:1})):'<span class="sm xnone">no exposures yet</span>'}</div>`};
 const row=r=>{const hid=myH.filter(t=>rk(t)==r),lk=lockedR(h,r);
  return `<div class="rack h r-bottom${g.dealer==0?' dealer':''}" data-rk="${r}" aria-label="Your ${RKN[r]}">${hid.map(t=>tile(t,{sel:g.sel.includes(t.id)||g.pd==t.id||g.pb===t.id||(g.bm&&g.bx===t.id),drag:1})).join('')||`<span class="sm srack-empty">${lk?'Hand complete – see the '+(r?'bottom':'top')+' line':'Drag tiles here'}</span>`}</div>`};
 return `<div class="seat st0 bottom me2"><div class="xlines">${line(0)}${line(1)}</div>${row(0)}${row(1)}<div class="tag">${NAMES[0]}${g.dealer==0?' <span class="dl">East · dealer</span>':''} <span class="sm" style="font-weight:400">· two racks, two hands · drag tiles to move them between racks</span></div></div>`}

function mkT(k){const o={k,id:++uid,x:false};if(k[0]=='F'&&k.length==2){o.k='F';o.fv=+k[1]}return o}
const lab=k=>{const s=k[0];if(TSET=='mtn'){if('DBC'.includes(s)&&k.length==2)return[MTN[s][k[1]],'','s'+s,k[1]];if(s=='w')return[MTN.W[k[1]]+'<span class="wl">'+k[1]+'</span>','','sw'];if(k=='dS')return[MTN.G.dS,'','dS'];if(s=='d')return[MTN.G[k],'','d'+k[1]];if(k=='F')return[MTN.F[0],'','sF'];if(k=='X')return['','','sX'];if(k=='J')return['<span class="jk">Joker</span>'+MTN.J,'','sJ']}if(s=='D'&&k.length==2)return[DOTS[k[1]],'','sD',k[1]];if(s=='B'&&k.length==2)return[BAMS[k[1]],'','sB',k[1]];if(s=='C'&&k.length==2)return[CRAKS[k[1]],'','sC',k[1]];if(SU.includes(s)&&k.length==2)return[k[1],SY[s],'s'+s];if(s=='w')return[WISP[k[1]]+'<span class="wl">'+k[1]+'</span>','','sw'];if(k=='dS')return[SOAP,'','dS'];if(s=='d')return[BOLT+GODS[k],'','d'+k[1]];if(k=='F')return[TULIP,'','sF'];if(k=='X')return['','','sX'];return['<span class="jk">Joker</span>'+WHEEL,'','sJ']};
function tile(t,o={}){let[a,b,c,d]=lab(t.k);if(t.k=='F'&&t.fv!=null)a=(TSET=='mtn'?MTN.F:FLOWERS)[t.fv];return `<button class="t ${c}${o.m?' m':''}${t.x?' ex':''}${o.sel?' sel':''}${o.last?' last':''}${o.drag&&freshAge(t)<2000?' fresh':''} ${o.take||o.pick?' take':''}" ${o.pick?`onclick="myClaim('claim')" title="Claim this tile"`:o.take?`onclick="takeDisc(${t.id})"`:o.m?'disabled':`onclick="tc(${t.id})"`}${o.drag?` data-id="${t.id}" onpointerdown="dDown(event,${t.id})"`:''}${o.drag?freshAttr(t):''}${o.did?` data-did="${t.id}"`:''}${t.x&&t.k=='J'?` data-xj="${t.id}"`:''}>${d?`<span class="cn">${d}</span>`:''}${t.k=='F'&&t.fv!=null?`<span class="fn">${t.fv+1}</span>`:''}<b>${a}</b><i>${b}</i></button>`}
const chip=k=>{const[a,b,c,d]=lab(k);return `<span class="t m ${c}">${d?`<span class="cn">${d}</span>`:''}<b>${a}</b><i>${b}</i></span>`};
/* the winning hand, laid out as full-size tiles in the middle of the table */
const winHTML=r=>`<div class="winov"><div class="winbox"><div class="wt">${r.w==0?'You':NAMES[r.w]} — Mahjong!</div><div class="wn">${r.b.n} · ${r.b.c?'C':''}${r.b.p} on the card${r.p!=r.b.p?' · +'+r.p+' this hand':''}</div><div class="wline">${r.b.g.map(([k,n])=>`<span class="wgrp">${tile({k,id:0,x:false},{m:1}).repeat(n)}</span>`).join('')}</div></div></div>`;
const grps=t=>t.g.map(([k,n])=>`<span class="grp">${chip(k).repeat(n)}</span>`).join('');
const down=n=>`<span class="t m back"></span>`.repeat(n);
/* ===== Play with friends (v96) =====
   One player hosts: their page runs the game and bots fill any seat without a person. Friends who have this page open
   (signed in to claude.ai and invited through Share) see each other in the lobby, can ask to join a hosted table,
   or accept the host's invitation. A friend sits in the seat that matches their club name; if a game is under way
   they are seated when the next game starts. The host sends each friend their own view of the table; friends send
   back their moves, which the host checks before applying. */
let room=null,NET='wait',MYP=null,HOSTP=null,ORD=null,CWS={},LSEED=null,LF=null,MYSEQ=0,SENTAT=0,SYNC=0;
const PEND={},LASTS={},ACK={},TC=new Map(),LOB={req:{},inv:{},got:null,asked:null,acc:null,note:null};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okPeer=p=>typeof p=='string'&&/^[\w.-]{1,80}$/.test(p);
const peerList=()=>room?room.peers().filter(p=>!p.sameTab&&p.kind=='viewer'):[];
const peerName=id=>{const p=room&&room.peers().find(q=>q.peer===id),n=p&&p.presence&&p.presence.me;return vn(n)?n:'A friend'};
const hostName=()=>HOSTP?peerName(HOSTP):'the host';
const seatOf=p=>{for(let s=1;s<4;s++)if(RS[s]===p)return s;return -1};
const gameOn=()=>!!(G.hands&&!['menu','dice','over','wait'].includes(G.phase));
function note(t){LOB.note={t,at:Date.now()};setTimeout(()=>{if(LOB.note&&Date.now()-LOB.note.at>=8000){LOB.note=null;render()}},8100)}
const noteTxt=()=>LOB.note&&Date.now()-LOB.note.at<8000?LOB.note.t:'';
function lob(d){if(room)room.emit('lobby',d).catch(e=>console.warn('lobby',e))}
function pres(){if(!room)return;room.presence({me:ME||null,host:MODE=='host'?1:0,at:MODE=='guest'?HOSTP:null,
 tbl:MODE=='host'?[0,1,2,3].map(s=>s==0?ME:RS[s]?NAMES[s]:null):null}).catch(()=>{})}

/* ---- host side ---- */
function hostTable(){if(!ME||!room)return;MODE='host';for(const k in RS)delete RS[k];for(const k in PEND)delete PEND[k];LOB.req={};LOB.inv={};LOB.got=null;LOB.asked=null;
 note('You’re hosting. Friends can ask to join, or invite them below. Tap Roll for East & deal when everyone’s seated.');pres();render()}
function stopHosting(){lob({t:'bye'});const was=[1,2,3].filter(s=>RS[s]);MODE='solo';for(const k in RS)delete RS[k];for(const k in PEND)delete PEND[k];LOB.req={};LOB.inv={};NAMES=seatFrom(ME);
 was.forEach(botTakeover);pres();render()}
function invite(p){if(MODE!='host'||!okPeer(p))return;LOB.inv[p]=1;lob({t:'inv',to:p,h:ME});render()}
function acceptReq(p){const n=LOB.req[p];delete LOB.req[p];if(n!=null)seatPeer(p,n);render()}
function declineReq(p){delete LOB.req[p];lob({t:'no',to:p});render()}
/* which seat a friend gets: their own club seat if it's free, otherwise any seat a bot holds (renamed to them) */
const PNAME={},DEFN=s=>{const used=n=>NAMES.some((x,i)=>i!=s&&sameName(x,n)),d=seatFrom(ME)[s];if(!used(d))return d;return CLUB.find(n=>!used(n))||'Bot '+s};
function seatFor(n,p){if(!vn(n)||sameName(n,ME))return -1;for(let s=1;s<4;s++){const who=RS[s]||PEND[s];if(who&&who!==p&&sameName(n,PEND[s]?PNAME[s]:NAMES[s]))return -1}
 const s0=NAMES.findIndex((x,i)=>i>0&&sameName(x,n));if(s0>0&&(!RS[s0]||RS[s0]===p)&&(!PEND[s0]||PEND[s0]===p))return s0;
 for(const s of [2,1,3])if(!RS[s]&&!PEND[s])return s;return -1}
function seatWhy(n){if(!vn(n))return 'hasn’t picked a name';if(sameName(n,ME))return 'also picked '+ME;return [1,2,3].some(s=>!RS[s]&&!PEND[s])?'someone is already playing as '+n:'the table is full'}
function seatPeer(p,n){const s=seatFor(n,p);
 if(s<1){lob({t:'no',to:p,why:sameName(n,ME)?'you both picked '+n+' – one of you needs a different name':seatWhy(n)});return}
 const now=!gameOn();if(now){RS[s]=p;NAMES[s]=n}else{PEND[s]=p;PNAME[s]=n}delete LOB.req[p];delete LOB.inv[p];
 lob({t:'ok',to:p,now});note(now?n+' joined your table.':n+' will join when the next game starts.');pres();render();delete LASTS[p];syncNow()}
function seatPending(){for(const s in PEND){if(room&&room.peers().some(q=>q.peer===PEND[s])){RS[s]=PEND[s];NAMES[s]=PNAME[s]||NAMES[s]}delete PEND[s];delete PNAME[s]}pres()}
function unseat(p,why){let hit=false;for(let s=1;s<4;s++){if(RS[s]===p){delete RS[s];hit=true;const was=NAMES[s];NAMES[s]=DEFN(s);note(was+' '+why+' – '+NAMES[s]+' (a bot) took the seat.');botTakeover(s)}if(PEND[s]===p){delete PEND[s];delete PNAME[s];hit=true}}
 delete LOB.req[p];delete LOB.inv[p];delete LASTS[p];if(hit)pres();render()}
function botTakeover(s){const g=G;if(isHuman(s))return;
 if(g.phase=='charleston')passCheck();else if(g.phase=='chask')voteCheck();else if(g.phase=='court')askCheck();else if(g.phase=='courtPick')courtCheck();
 else if(g.phase=='play'){const cw=g.cw;if(cw&&cw.wait&&cw.wp==s){cw.wait=false;cw.dec[s]=botDec(s,cw.t);setTimeout(()=>{if(G===g&&g.cw===cw){cw.i++;stepClaims()}},CW_MS)}
  else if(!cw&&g.cur==s)go()}}
function onAct(m){const d=m.data;if(MODE!='host'||!d||d.to!==MYP)return;const s=seatOf(m.peer);if(s<1)return;ACK[m.peer]=Math.max(ACK[m.peer]||0,+d.q||0);const g=G;
 try{switch(d.a){
  case 'pass':submitPass(s,d.ids);break;
  case 'vote':vote(s,!!d.y);break;
  case 'cask':ask(s,d.n);break;
  case 'cpick':cpick(s,d.ids);break;
  case 'claim':claimFor(s,String(d.c));break;
  case 'disc':{if(g.phase!='play'||g.cur!=s||g.cw||g.hands[s].length!=HN()+1)break;const t=g.hands[s].find(u=>u.id===d.id&&!u.x);if(t)discard(s,t);break}
  case 'mj':if(g.phase=='play'&&g.cur==s&&!g.cw&&g.hands[s].length==HN()+1&&best(g.hands[s])[1]==0)end(s,true);break;
  case 'blank':blankFor(s,d.did,d.xid);break;
  case 'jx':jokerFor(s,d.jid,d.tid);break}}catch(e){console.error(e)}
 delete LASTS[m.peer];render()}
/* what one friend may see, turned so that they sit in seat 0 */
const enc=t=>t.k+'~'+t.id+(t.fv!=null?'~f'+t.fv:'')+(t.x?'~x'+(t.xs!=null?t.xs:'')+'~'+t.xk:'');
function stateFor(s){const g=G,R=i=>i==null||i<0?i:(i-s+4)%4,RA=a=>a?[0,1,2,3].map(j=>a[(j+s)%4]):a,now=Date.now();
 const o={v:APP_VER,ph:g.phase,nm:NAMES[s],nms:RA(NAMES),sc:RA(SC),setn:SET.n,hu:RA([0,1,2,3].map(i=>isHuman(i)?1:0)),opt:g.opt,lvl:g.lvl,dl:R(g.dealer),ack:ACK[RS[s]]||0};
 if(g.phase=='dice')return Object.assign(o,{face:RA(g.face),dice:RA(g.dice),east:R(g.east),tie:!!g.tie});
 if(!g.hands||g.phase=='menu')return Object.assign(o,{ph:'menu'});
 const over=g.phase=='over';
 Object.assign(o,{cur:R(g.cur),N:g.N,per:g.per,bo:g.brk-WO.indexOf(g.dealer)*g.per,seed:g.seed,used:g.used,wl:g.wall.length,disc:g.disc.map(enc),chs:g.chs,
  hd:RA(g.hands.map((h,i)=>i==s||over?h.map(enc):{x:h.filter(t=>t.x).map(enc),n:h.filter(t=>!t.x).length})),
  cs:RA([0,1,2,3].map(i=>g.chsel&&g.chsel[i]?1:0)),vt:RA([0,1,2,3].map(i=>g.votes&&g.votes[i]!=null?(g.votes[i]?1:0):null)),pm:(g.pmsg&&g.pmsg[s])||''});
 if(g.cq)o.cq={b:RA(g.cq.b),k:g.cq.k?RA(g.cq.k):null,pk:RA([0,1,2,3].map(i=>g.cq.pk&&g.cq.pk[i]?1:0))};
 const cw=g.cw;if(cw)o.cw={t:cw.t.id,from:R(cw.from),order:cw.order.map(R),i:cw.i,dec:RA([0,1,2,3].map(i=>cw.dec[i]||null)),wait:!!cw.wait,wp:cw.wait?R(cw.wp):null,ann:cw.ann?1:0};
 if(g.res){const r=Object.assign({},g.res);delete r.b;r.w=R(r.w);r.from=R(r.from);r.d=RA(r.d);o.res=r}
 if(g.flash&&now-g.flash.t<3000)o.fl={txt:g.flash.txt,age:now-g.flash.t};
 const L=g.lastDraw;if(L&&L.t&&L.t.nw&&now-L.t.nw<2000)o.ld={p:R(L.p),id:L.p==s?L.t.id:null,age:now-L.t.nw};
 return o}
function queueSync(){if(SYNC||!room)return;SYNC=setTimeout(()=>{SYNC=0;syncNow()},120)}
function syncNow(){if(MODE!='host'||!room)return;for(let s=1;s<4;s++){const p=RS[s];if(!p)continue;let o;try{o=stateFor(s)}catch(e){console.error(e);continue}
 const j=JSON.stringify(o);if(LASTS[p]===j)continue;LASTS[p]=j;
 if(j.length>3900){o.disc=o.disc.slice(-60);o.trim=1}
 room.emit('st',{to:p,s:o}).catch(e=>console.warn('sync',e))}}

/* ---- a bot's seat: rack along its side of the table (backs until the game ends), exposures toward the middle ---- */
const POS={1:'right',2:'top',3:'left'};
function seatHTML(i,over){const g=G,H=g.hands[i],ex=exOrder(H),hid=H.filter(t=>!t.x),pos=POS[i],v=pos!='top';
const face=t=>v?`<span class="rot r${pos=='left'?90:-90}">${tile(t,{m:1})}</span>`:tile(t,{m:1});

const rack=`<div class="rack ${v?'v':'h'} r-${pos}${g.dealer==i?' dealer':''}" aria-label="${NAMES[i]}'s rack, ${hid.length} tiles">${over?hid.map(face).join(''):`<span class="bk${v?' v':''}"></span>`.repeat(Math.max(0,hid.length-(fr?1:0)))+(fr?`<span class="bk${v?' v':''} fresh"${freshAttr(ld)}></span>`:'')}</div>`;
const xs=ex.length?`<div class="xs ${v?'xcol':'xrow'}">${SIAM()?[0,1].map(r=>xsTiles(ex.filter(t=>rk(t)==r),face)).filter(Boolean).join('<span class="xgap"></span>'):ex.map(face).join('')}</div>`:'';

/* ---- Messy pile: every tile gets its own grid cell (random cell, random turn, jitter that keeps it inside the cell), so no two tiles ever overlap.
   The layout is seeded per game, so tiles stay put between turns; drawn tiles simply disappear. ---- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function layoutPile(){const el=document.querySelector('.pile');if(!el||!G.wall)return;const g=G,N=g.N,n=g.wall.length;el.style.minHeight='';
let W=el.clientWidth,H=el.clientHeight,c=46;while(c>26&&Math.floor(W/c)*Math.floor(H/c)<N)c--;
const cols=Math.max(1,Math.floor(W/c));let rows=Math.floor(H/c);if(cols*rows<N){rows=Math.ceil(N/cols);H=rows*c;el.style.minHeight=H+'px'}
const ox=(W-cols*c)/2,oy=(H-rows*c)/2,R=rng(g.seed),cells=[...Array(cols*rows).keys()];
for(let i=cells.length-1;i>0;i--){const j=R()*(i+1)|0;[cells[i],cells[j]]=[cells[j],cells[i]]}
const tw=c*.46,th=c*.64;let out='';
for(let i=0;i<N;i++){const q=cells[i],r=R()*360|0,a=r*Math.PI/180,cs=Math.abs(Math.cos(a)),sn=Math.abs(Math.sin(a)),bw=tw*cs+th*sn,bh=tw*sn+th*cs,jx=R(),jy=R();if(i>=n)continue;
 const x=ox+(q%cols)*c+c/2+(jx-.5)*(c-bw),y=oy+Math.floor(q/cols)*c+c/2+(jy-.5)*(c-bh);
 out+=`<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${tw.toFixed(1)}px;height:${th.toFixed(1)}px;margin:${(-th/2).toFixed(1)}px 0 0 ${(-tw/2).toFixed(1)}px;font-size:${(tw*.3).toFixed(1)}px;transform:rotate(${r}deg)"></i>`}
el.innerHTML=out}
addEventListener('resize',()=>{if(G.phase=='menu')return;if(G.opt.table=='messy')layoutPile();sizePool()});
/* discard tiles: pick the biggest size at which every tile that could ever be discarded this game (all tiles minus four 13-tile hands and the last draw)
   fits in the middle of the table, so a full pool nearly fills it */
function sizePool(){const el=document.querySelector('.pool');if(!el||!G.N)return;const M=Math.max(20,G.N-53),cs=getComputedStyle(el);
 const W=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=el.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);if(W<=0||H<=0)return;
 let h=66;for(;h>=18;h-=.5){const w=h*.714,cols=Math.floor((W+.01)/(w+2)),rows=Math.floor((H+.01)/(h+2));if(cols*rows>=M)break}
 el.style.setProperty('--dh',h+'px');el.style.setProperty('--dw',(h*.714).toFixed(2)+'px')}

function centerHTML(){const g=G,pool=`<div class="pool">${g.disc.map((t,i)=>tile(t,{m:1,last:i==g.disc.length-1,take:g.bm&&swapOK(t),sel:g.bm&&g.pt===t.id,did:1,pick:i==g.disc.length-1&&g.cw&&g.cw.wait&&g.cw.wp==0})).join('')||'<span class="sm">Discards appear here</span>'}</div>`;

/* a card line is dead when none of its versions can still be made: a pair or single needs more natural tiles than are left

   a part needs more than naturals + jokers left, your exposed sets don't fit it, or it's concealed and you've exposed */
function deadHands(){if(SIAM())return {};const g=G,me=g.hands[0],out={},seen={},myX=me.filter(t=>t.x),myBl=me.filter(t=>t.k=='X'&&!t.x).length;
 const TOT=k=>k=='F'?8:k=='J'?8+g.opt.xj:4;

 const sets={};myX.forEach(t=>{const id=t.xs||('k'+t.k);(sets[id]=sets[id]||{k:t.xk||t.k,n:0}).n++});const xs=Object.values(sets);

 for(const t of T){if(alive.has(t.id))continue;if(xs.length&&t.c)continue;let ok=true;
  for(const s of xs){const e=t.m.find(([k])=>k==s.k);if(!e||e[2]<s.n){ok=false;break}}
  if(ok)for(const[k,n,j]of t.m){const nat=Math.min(TOT(k),TOT(k)-(seen[k]||0)+Math.min(myBl,discBy(k)));if(nat<n-j||nat+jokAvail<n){ok=false;break}}

  row('Flowers',[0,1,2,3,4,5,6,7].map(i=>['F',(i+1)+' '+flName(i),i]))+
  (pk?'':row('Jokers &amp; Blanks',[['J','Joker'],['X','Blank']]))}
function renderKey(){let el=document.getElementById('tkey');const pk=KEYPICK();
 if(!KEYON&&!pk){if(el)el.remove();return}
 if(el&&el.dataset.pk!=String(pk)){el.remove();el=null}
 if(!el){el=document.createElement('div');el.id='tkey';el.dataset.pk=String(pk);el.setAttribute('role','dialog');el.setAttribute('aria-label','Tile key');document.body.appendChild(el);el.innerHTML=keyHTML()}else if(pk)el.innerHTML=keyHTML();
 const a=document.getElementById('app').getBoundingClientRect(),w=Math.max(280,Math.min(a.width-16,900));
 el.style.left=Math.max(8,a.left+(a.width-w)/2)+'px';el.style.width=w+'px'}
addEventListener('resize',()=>{if(KEYON)renderKey()});
function setRank(v){if(NOGO)v=false;RANK=v;try{localStorage.setItem('mcRank',v?'1':'0')}catch(e){}renderCard()}
function renderCard(){const near={},inGame=G.hands&&G.phase!='menu',rail=document.getElementById('rail');
const dead={};if(inGame&&G.phase!='dice')Object.assign(dead,deadHands());
if(inGame){const H0=SIAM()?G.hands[0].filter(t=>!t.lk):G.hands[0],c=cnt(H0),ex=H0.some(t=>t.x);T.forEach(t=>{if(ex&&t.c)return;const d=dist(t,c);if(near[t.id]==null||d<near[t.id])near[t.id]=d})}
/* keep each category's scroll position across re-renders */
const keep={rail:rail.scrollTop};rail.querySelectorAll('.cat').forEach(el=>{const bd=el.querySelector('.body');if(bd&&el.dataset.k)keep[el.dataset.k]=bd.scrollTop});
const head=(k,title,sub)=>{const shut=!!CLOSED[k];return `<div class="sh" onclick="togCat('${k}')"><h3>${title}</h3>${sub}<button class="x" aria-expanded="${!shut}" aria-label="${shut?'Open':'Close'} ${title}" title="${shut?'Open':'Close'}" onclick="togCat('${k}',event)">${shut?'+':'✕'}</button></div>`};
const sec=(S,k)=>{const shut=!!CLOSED[k],hot=S.h.filter(H=>near[H.id]!=null&&near[H.id]<=3).length,mk=S.h.filter(H=>MARK[H.id]).length;
 const sub=shut?`<span class="cnt">${S.h.length} hands${hot&&!NOGO?` · ${hot} within 3`:''}${mk?` · <span class="mkn">${mk} ticked</span>`:''}</span>`:(S.q?`<span>${S.q}</span>`:'<span></span>');
 return `<section class="cat${shut?' shut':''}${mk?' hasmk':''}" data-k="${k}">${head(k,S.sec,sub)}<div class="body">${S.h.map(H=>line(H,S)).join('')}</div></section>`};
const line=(H,S,tag)=>{const d=near[H.id];
 return `<div class="ln${H.c?' c':''}${dead[H.id]?' dead':''}${d!=null&&d<=3&&!dead[H.id]?' hot':''}${MARK[H.id]?' mk':''}"><input type="checkbox" class="mkb" aria-label="Highlight ${S.sec} hand ${H.line}" ${MARK[H.id]?'checked':''} onchange="togMark(${H.id},this.checked)"><span class="no">${H.line}</span><div class="hd">${tag?`<span class="rk">${S.sec}</span>`:''}${H.alts.map(altHTML).join('<span class="or">or</span>')}${H.n?`<span class="nt">(${H.n})</span>`:''}${d!=null&&!NOGO?`<span class="togo">${d} to go</span>`:''}</div><span class="val">${H.c?'C':''}${H.p}</span></div>`};
const ranked=()=>{if(!inGame)return `<section class="cat"><div class="sh"><h3>Potential hands</h3><span>Deal a game to rank hands by tiles to go.</span></div></section>`;
 const live=HANDS.filter(H=>!dead[H.id]&&near[H.id]!=null).sort((a,b)=>near[a.id]-near[b.id]||b.p-a.p),nd=HANDS.length-live.length;
 return `<section class="cat rkcat"><div class="sh"><h3>Potential hands</h3><span>fewest tiles to go first${nd?` · ${nd} dead or not possible left out`:''}</span></div><div class="body">${live.map(H=>line(H,CARD.find(S=>S.h.includes(H)),1)).join('')}</div></section>`};
const rules=`<section class="cat${CLOSED.rules?' shut':''}" data-k="rules">${head('rules','Card rules','<span></span>')}<div class="body"><div class="rules">${CARDS[CARDID].rules}</div></div></section>`;
rail.innerHTML=`<div class="rail-hd"><b>${CARDS[CARDID].name}</b><label class="rkopt keyopt"><input type="checkbox" ${KEYON?'checked':''} onchange="setKey(this.checked)"> Show tile key</label><label class="rkopt"><input type="checkbox" ${RANK&&!NOGO?'checked':''} ${NOGO?'disabled':''} onchange="setRank(this.checked)"> Rank order potential hands${NOGO?' <span class="rkoff">(off while tile counts are hidden)</span>':''}</label><label class="rkopt nogoopt"><input type="checkbox" ${NOGO?'checked':''} onchange="setNoGo(this.checked)"> Hide # of tiles needed for Mahjong</label><div class="rail-tools"${RANK&&!NOGO?' style="visibility:hidden"':''}><button onclick="allCats(false)">Open all</button><button onclick="allCats(true)">Close all</button></div><span><span class="cr">Red</span> <span class="cg">Green</span> <span class="cb">Blue</span> = suits · F Flower · D Dragon · 0 Soap${inGame?' · green = within 3 tiles · yellow = ticked · red = dead hand':''}</span></div>${RANK&&!NOGO?ranked():CARD.map(sec).join('')}${rules}`;
rail.scrollTop=keep.rail;renderKey();rail.querySelectorAll('.cat').forEach(el=>{const bd=el.querySelector('.body');if(bd&&keep[el.dataset.k])bd.scrollTop=keep[el.dataset.k]})}
applyTiles();render();netInit();
</script>
